# Railway Configuration for Frontend
# This file tells Railway how to deploy the frontend service

# Build configuration
RAILWAY_BUILD_COMMAND="npm ci && npm run build"

# Start command
RAILWAY_START_COMMAND="npx serve -s dist/productify-frontend -l 80"

# Root directory
RAILWAY_ROOT_DIRECTORY="frontend/productify-frontend"

# Static site configuration
RAILWAY_SPA_OUTPUT_DIR="dist/productify-frontend"
