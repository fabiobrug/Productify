<!-- Mobile-First Filter Section -->
<div class="px-4 py-3">
  <!-- Search Bar -->
  <div class="relative mb-3">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
    </div>
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange($event)"
      placeholder="Search products..."
      class="input-field pl-10 pr-4 py-3 touch-target">
  </div>

  <!-- Filter Controls -->
  <div class="flex items-center justify-between">
    <!-- Sort Controls -->
    <div class="flex items-center space-x-2">
      <select
        [(ngModel)]="sortBy"
        (ngModelChange)="onSortChange()"
        class="input-field py-2 px-3 text-sm touch-target">
        <option *ngFor="let option of sortOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
      
      <button
        (click)="onToggleSortOrder()"
        class="p-2 text-gray-600 hover:text-gray-900 touch-target"
        [title]="sortOrder === 'asc' ? 'Sort Ascending' : 'Sort Descending'">
        <svg class="w-5 h-5" [class.rotate-180]="sortOrder === 'desc'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
        </svg>
      </button>
    </div>

    <!-- Advanced Filters Toggle -->
    <div class="flex items-center space-x-2">
      <button
        (click)="toggleAdvancedFilters()"
        class="flex items-center space-x-1 px-3 py-2 text-sm text-gray-600 hover:text-gray-900 touch-target"
        [class.text-primary-600]="showAdvancedFilters">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.207A1 1 0 013 6.5V4z"></path>
        </svg>
        <span>Filters</span>
        <span *ngIf="hasActiveFilters()" class="w-2 h-2 bg-primary-600 rounded-full"></span>
      </button>

      <!-- Clear Filters -->
      <button
        *ngIf="hasActiveFilters()"
        (click)="onClearFilters()"
        class="px-3 py-2 text-sm text-red-600 hover:text-red-700 touch-target">
        Clear
      </button>
    </div>
  </div>

  <!-- Advanced Filters Panel -->
  <div *ngIf="showAdvancedFilters" class="mt-4 p-4 bg-gray-50 rounded-lg animate-slide-up">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Price Range -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Price Range</label>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <input
              type="number"
              [(ngModel)]="minPrice"
              (ngModelChange)="onMinPriceChange($event)"
              placeholder="Min"
              step="0.01"
              min="0"
              class="input-field py-2 px-3 text-sm touch-target">
          </div>
          <div>
            <input
              type="number"
              [(ngModel)]="maxPrice"
              (ngModelChange)="onMaxPriceChange($event)"
              placeholder="Max"
              step="0.01"
              min="0"
              class="input-field py-2 px-3 text-sm touch-target">
          </div>
        </div>
      </div>

      <!-- Quick Price Filters -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Quick Filters</label>
        <div class="flex flex-wrap gap-2">
          <button
            (click)="onQuickPriceFilter('0', '50')"
            class="px-3 py-1 text-xs bg-gray-200 hover:bg-gray-300 rounded-full touch-target">
            Under R$50
          </button>
          <button
            (click)="onQuickPriceFilter('50', '100')"
            class="px-3 py-1 text-xs bg-gray-200 hover:bg-gray-300 rounded-full touch-target">
            R$50-R$100
          </button>
          <button
            (click)="onQuickPriceFilter('100', '')"
            class="px-3 py-1 text-xs bg-gray-200 hover:bg-gray-300 rounded-full touch-target">
            Over R$100
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
