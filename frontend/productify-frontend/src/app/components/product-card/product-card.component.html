<!-- Mobile-First Product Card -->
<div class="card hover:shadow-md transition-shadow duration-200 cursor-pointer group">
  <!-- Card Header -->
  <div class="flex items-start justify-between mb-3">
    <div class="flex-1 min-w-0">
      <h3 class="text-lg font-semibold text-gray-900 truncate group-hover:text-primary-600 transition-colors">
        {{ product.name }}
      </h3>
      <div class="text-xl font-bold text-primary-600 mt-1">
        {{ formatPrice(product.price) }}
      </div>
    </div>
    
    <!-- Action Menu -->
    <div class="flex items-center space-x-1 ml-2">
      <button
        routerLink="/products/edit/{{ product.id }}"
        class="p-2 text-gray-400 hover:text-primary-600 touch-target"
        title="Edit Product">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
        </svg>
      </button>
      
      <button
        (click)="onDelete($event)"
        class="p-2 text-gray-400 hover:text-red-600 touch-target"
        title="Delete Product">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Product Description -->
  <div class="text-gray-600 text-sm leading-relaxed">
    <p class="line-clamp-3">
      {{ truncateText(product.description, 120) }}
    </p>
  </div>

  <!-- Card Footer -->
  <div class="mt-4 pt-3 border-t border-gray-100">
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-500">
        ID: {{ product.id }}
      </span>
      
      <!-- Mobile Action Buttons -->
      <div class="flex space-x-2 md:hidden">
        <button
          routerLink="/products/edit/{{ product.id }}"
          class="px-3 py-1 text-xs bg-primary-100 text-primary-700 rounded-full hover:bg-primary-200 touch-target">
          Edit
        </button>
        <button
          (click)="onDelete($event)"
          class="px-3 py-1 text-xs bg-red-100 text-red-700 rounded-full hover:bg-red-200 touch-target">
          Delete
        </button>
      </div>
    </div>
  </div>
</div>
