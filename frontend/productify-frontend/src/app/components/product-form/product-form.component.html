<!-- Mobile-First Product Form -->
<div class="min-h-screen bg-gray-50 safe-area-inset">
  <!-- Sticky Header -->
  <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-40">
    <div class="px-4 py-3">
      <div class="flex items-center justify-between">
        <!-- Back Button -->
        <button
          (click)="onCancel()"
          class="flex items-center space-x-2 text-gray-600 hover:text-gray-900 touch-target">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
          <span class="font-medium">Back</span>
        </button>

        <!-- Title -->
        <h1 class="text-lg font-semibold text-gray-900">
          {{ isEditMode ? 'Edit Product' : 'Add Product' }}
        </h1>

        <!-- Save Button -->
        <button
          (click)="onSubmit()"
          [disabled]="productForm.invalid || isLoading"
          class="btn-primary touch-target disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!isLoading">
            {{ isEditMode ? 'Update' : 'Save' }}
          </span>
          <span *ngIf="isLoading" class="flex items-center">
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Saving...
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- Form Content -->
  <main class="px-4 py-6">
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="max-w-2xl mx-auto">
      <div class="space-y-6">
        <!-- Product Name -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
            Product Name *
          </label>
          <input
            id="name"
            type="text"
            formControlName="name"
            placeholder="Enter product name"
            class="input-field py-3 px-4 touch-target"
            [class.border-red-500]="isFieldInvalid('name')"
            [class.focus:border-red-500]="isFieldInvalid('name')"
            [class.focus:ring-red-500]="isFieldInvalid('name')">
          
          <div *ngIf="isFieldInvalid('name')" class="mt-1 text-sm text-red-600">
            {{ getFieldError('name') }}
          </div>
        </div>

        <!-- Price -->
        <div>
          <label for="price" class="block text-sm font-medium text-gray-700 mb-2">
            Price *
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="text-gray-500 sm:text-sm">R$</span>
            </div>
            <input
              id="price"
              type="number"
              formControlName="price"
              placeholder="0.00"
              step="0.01"
              min="0.01"
              max="999999.99"
              class="input-field py-3 pl-8 pr-4 touch-target"
              [class.border-red-500]="isFieldInvalid('price')"
              [class.focus:border-red-500]="isFieldInvalid('price')"
              [class.focus:ring-red-500]="isFieldInvalid('price')">
          </div>
          
          <div *ngIf="isFieldInvalid('price')" class="mt-1 text-sm text-red-600">
            {{ getFieldError('price') }}
          </div>
        </div>

        <!-- Description -->
        <div>
          <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
            Description *
          </label>
          <textarea
            id="description"
            formControlName="description"
            placeholder="Enter product description"
            rows="4"
            class="input-field py-3 px-4 touch-target resize-none"
            [class.border-red-500]="isFieldInvalid('description')"
            [class.focus:border-red-500]="isFieldInvalid('description')"
            [class.focus:ring-red-500]="isFieldInvalid('description')">
          </textarea>
          
          <div class="flex justify-between items-center mt-1">
            <div *ngIf="isFieldInvalid('description')" class="text-sm text-red-600">
              {{ getFieldError('description') }}
            </div>
            <div class="text-sm text-gray-500">
              {{ productForm.get('description')?.value?.length || 0 }}/500 characters
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile Action Buttons -->
      <div class="mt-8 space-y-3 md:hidden">
        <button
          type="submit"
          [disabled]="productForm.invalid || isLoading"
          class="w-full btn-primary touch-target disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!isLoading">
            {{ isEditMode ? 'Update Product' : 'Create Product' }}
          </span>
          <span *ngIf="isLoading" class="flex items-center justify-center">
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Saving...
          </span>
        </button>
        
        <button
          type="button"
          (click)="onCancel()"
          class="w-full btn-secondary touch-target">
          Cancel
        </button>
      </div>
    </form>
  </main>
</div>
