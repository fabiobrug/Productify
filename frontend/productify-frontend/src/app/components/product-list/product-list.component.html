<!-- Mobile-First Product List Layout -->
<div class="min-h-screen bg-gray-50 safe-area-inset">
  <!-- Header Section -->
  <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-40">
    <div class="px-4 py-3">
      <div class="flex items-center justify-between">
        
        <!-- Title -->
        <h1 class="text-2xl font-bold text-gray-900">
          Produtos
        </h1>

        <!-- Mobile Refresh Button -->
        <button 
          (click)="onRefresh()"
          class="md:hidden p-2 text-gray-600 hover:text-gray-900 touch-target">
          <span class="material-icons">refresh</span>
        </button>

        <!-- Desktop Add Button -->
        <button 
          routerLink="/products/add"
          class="hidden md:flex btn-primary touch-target ml-auto">
          <span class="material-icons mr-2">add</span>
          Add Product
        </button>
      </div>
    </div>
  </header>

  <!-- Filter Section -->
  <div class="bg-white border-b border-gray-200">
    <app-filter-section 
      (filterChange)="onFilterChange($event)"
      (clearFilters)="onClearFilters()">
    </app-filter-section>
  </div>

  <!-- Main Content -->
  <main class="px-4 py-6">
    <!-- Loading State -->
    <div *ngIf="loading$ | async" class="space-y-4">
      <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
        <div *ngFor="let i of [1,2,3,4,5,6]" class="card animate-pulse">
          <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
          <div class="h-3 bg-gray-200 rounded w-1/2 mb-3"></div>
          <div class="h-3 bg-gray-200 rounded w-full mb-1"></div>
          <div class="h-3 bg-gray-200 rounded w-2/3"></div>
        </div>
      </div>
    </div>

    <!-- Products Grid -->
    <div *ngIf="!(loading$ | async)" class="space-y-4">
      <!-- Product Count -->
      <div class="flex items-center justify-between mb-4">
        <p class="text-sm text-gray-600">
          <span class="font-medium">{{ productCount$ | async }}</span> products found
        </p>
      </div>

      <!-- Products List -->
      <div *ngIf="(products$ | async)?.length! > 0; else emptyState" 
           class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
        <app-product-card 
          *ngFor="let product of products$ | async; trackBy: trackByProductId"
          [product]="product"
          (delete)="onDeleteProduct($event)"
          class="animate-fade-in">
        </app-product-card>
      </div>

      <!-- Empty State -->
      <ng-template #emptyState>
        <div class="text-center py-12">
          <div class="w-24 h-24 mx-auto mb-4 bg-gray-100 rounded-full flex items-center justify-center">
            <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
            </svg>
          </div>
          <h3 class="text-lg font-semibold text-gray-900 mb-2">No products found</h3>
          <p class="text-gray-600 mb-6">Get started by adding your first product.</p>
          <button 
            routerLink="/products/add"
            class="btn-primary touch-target">
            <span class="material-icons mr-2">add</span>
            Add Your First Product
          </button>
        </div>
      </ng-template>
    </div>
  </main>

  <!-- Mobile Floating Action Button -->
  <button 
    routerLink="/products/add"
    class="fab md:hidden">
    <span class="material-icons fab-icon">add</span>
  </button>
</div>
