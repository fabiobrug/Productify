version: '3.8'

services:
  # Banco de dados PostgreSQL para desenvolvimento
  database:
    image: postgres:15-alpine
    container_name: productify-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: productify_dev
      POSTGRES_USER: productify_user
      POSTGRES_PASSWORD: productify_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - productify-network

  # Backend em modo desenvolvimento
  backend:
    build:
      context: ./backend/crud-api
      dockerfile: Dockerfile.dev.fast
    container_name: productify-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: productify_dev
      DATABASE_USER: productify_user
      DATABASE_PASSWORD: productify_password
      DATABASE_URL: postgresql://productify_user:productify_password@database:5432/productify_dev
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend/crud-api:/app
      - /app/node_modules
    depends_on:
      - database
    networks:
      - productify-network
    command: npm run start:dev

volumes:
  postgres_dev_data:
    driver: local

networks:
  productify-network:
    driver: bridge
